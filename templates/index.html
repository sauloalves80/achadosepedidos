<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achados e Perdidos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Achados e Perdidos</h1>
            <p>Encontrou ou perdeu algo? Cadastre aqui!</p>
            <a href="{{ url_for('logout') }}" class="link-sair">Sair</a>
        </header>

        <nav class="filtros">
            <button class="filtro-btn ativo" data-tipo="">Todos</button>
            <button class="filtro-btn" data-tipo="achado">Achados</button>
            <button class="filtro-btn" data-tipo="pedido">Pedidos</button>
        </nav>

        <div class="busca">
            <input type="text" id="busca" placeholder="Buscar item...">
        </div>

        <button class="btn-novo" onclick="abrirModal()">+ Novo Registro</button>

        <div id="lista-itens" class="lista-itens"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="fechar" onclick="fecharModal()">&times;</span>
            <h2>Novo Registro</h2>
            <form id="form-item" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Nome do Item *</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="form-group">
                    <label>Descricao</label>
                    <textarea id="descricao"></textarea>
                </div>
                <div class="form-group">
                    <label>Local *</label>
                    <input type="text" id="local" required>
                </div>
                <div class="form-group">
                    <label>Data *</label>
                    <input type="date" id="data" required>
                </div>
                <div class="form-group">
                    <label>Tipo *</label>
                    <select id="tipo" required>
                        <option value="achado">Achado</option>
                        <option value="devolvido">Devolvido</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Matricula</label>
                    <input type="text" id="matricula">
                </div>
                <div class="form-group">
                    <label>Nome de Quem Encontrou</label>
                    <input type="text" id="encontrado_por">
                </div>
                <div class="form-group">
                    <label>Fotos (ate 3)</label>
                    <div class="fotos-upload-grid" id="fotos-upload-grid">
                        <div class="foto-slot" data-index="0" onclick="selecionarFoto(0)">
                            <span class="foto-slot-placeholder">+</span>
                        </div>
                        <div class="foto-slot" data-index="1" onclick="selecionarFoto(1)">
                            <span class="foto-slot-placeholder">+</span>
                        </div>
                        <div class="foto-slot" data-index="2" onclick="selecionarFoto(2)">
                            <span class="foto-slot-placeholder">+</span>
                        </div>
                    </div>
                    <input type="file" id="foto-input" accept="image/*" style="display:none" onchange="fotoSelecionada(this)">
                </div>
                <button type="submit" class="btn-salvar">Salvar</button>
            </form>
        </div>
    </div>

    <div id="modal-devolucao" class="modal">
        <div class="modal-content">
            <span class="fechar" onclick="fecharModalDevolucao()">&times;</span>
            <h2>Confirmar Devolucao</h2>
            <form id="form-devolucao">
                <input type="hidden" id="devolucao-id">
                <div class="form-group">
                    <label>Data da Devolucao *</label>
                    <input type="date" id="data-devolucao" required>
                </div>
                <div class="form-group">
                    <label>Nome de Quem Recebeu *</label>
                    <input type="text" id="nome-receptor" required>
                </div>
                <div class="form-group">
                    <label>Matricula de Quem Recebeu *</label>
                    <input type="text" id="matricula-receptor" required>
                </div>
                <div class="form-group">
                    <label>Assinatura de Quem Recebeu *</label>
                    <div class="signature-pad">
                        <canvas id="canvas-assinatura"></canvas>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button type="button" class="btn-limpar" onclick="limparAssinatura()">Limpar Assinatura</button>
                        <button type="button" class="btn-limpar" onclick="toggleFullscreenSignature()">⛶ Tela Cheia</button>
                    </div>
                </div>
                <button type="button" class="btn-salvar" onclick="confirmarDevolucao()">Confirmar Devolucao</button>
            </form>
        </div>
    </div>

    <div id="lightbox" class="lightbox" onclick="fecharLightbox()">
        <img id="lightbox-img" src="" alt="Foto ampliada">
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
